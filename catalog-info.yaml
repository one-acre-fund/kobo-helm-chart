apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kpi
  description: KPI web application (main KoboToolbox UI/API)
  links:
    - url: https://surveys.oneacrefund.org/
      title: KPI Surveys
      icon: web
  annotations:
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=kobo
spec:
  type: service
  lifecycle: production
  owner: field-apps
  system: clif
  dependsOn:
    - resource:kpi-database
    - resource:mongodb
    - resource:s3-bucket
    - resource:redis
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kobocat
  description: KoboCat web application (form submissions/data collection API)
