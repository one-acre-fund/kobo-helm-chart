    - url: https://kc-surveys.oneacrefund.org/
      title: KoboCat Surveys
      icon: web
  annotations:
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=kobo
spec:
  type: service
  lifecycle: production
  owner: field-apps
  system: clif
  dependsOn:
    - resource:kobocat-database
    - resource:mongodb
    - resource:s3-bucket
    - resource:redis
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kpi-workers
  description: Celery workers processing async/background tasks for KPI
  annotations:
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=kobo
spec:
  type: service
  lifecycle: production
  owner: field-apps
  system: clif
